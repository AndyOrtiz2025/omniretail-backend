# Mantiene al dia acciones de GitHub, dependencias Maven e imagenes base del Dockerfile.
# Cada ecosistema abre un PR semanal agrupado hacia development.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Solo se agrupan minor/patch; los saltos de version mayor llegan en PR propio para revisarlos aparte.
  - package-ecosystem: maven
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # openpdf 3 cambia los paquetes com.lowagie y rompe PurchaseOrderPdfRenderer.
      - dependency-name: "com.github.librepdf:openpdf"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    ignore:
      # El proyecto se queda en Java 21: sin saltos de version mayor de la imagen base.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
