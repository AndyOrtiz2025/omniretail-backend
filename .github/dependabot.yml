# Mantiene al dia acciones de GitHub, dependencias Maven e imagenes base del Dockerfile.
# Cada ecosistema abre un PR semanal agrupado hacia development.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Solo se agrupan minor/patch; los saltos de version mayor llegan en PR propio para revisarlos aparte.
  - package-ecosystem: maven
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: weekly
