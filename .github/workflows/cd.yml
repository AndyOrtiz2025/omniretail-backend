name: CD

# Despliegue a produccion. Cada push a main corre primero la CI completa (ci.yml como workflow reutilizable)
# y solo si queda en verde se publica la imagen y se despliega. Siempre se construye el commit del push
# (github.sha): nunca codigo que llegue de otro evento o de un fork.
on:
  push:
    branches: [main]
  workflow_dispatch: # Redesplegar main a mano (p. ej. despues de cambiar el .env del VPS).

concurrency:
  group: cd-production-backend
  cancel-in-progress: false # Nunca cortar un despliegue a la mitad.

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    secrets: inherit # SONAR_TOKEN y GEMINI_API_KEY.
    permissions:
      contents: read
      pull-requests: write # Lo declara el job de revision con IA de ci.yml; en un push no se ejecuta.

  image:
    name: Imagen Docker (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Version a desplegar
        id: version
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-xxxxxxx es la etiqueta inmutable que se despliega; latest queda solo como referencia.
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build y push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en VPS
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read # GITHUB_TOKEN de este run puede descargar la imagen que publico el job anterior.

    steps:
      - name: VPS no configurado
        if: vars.VPS_HOST == ''
        run: echo "::notice title=Deploy::La variable VPS_HOST esta vacia. La imagen quedo publicada en GHCR; el despliegue se omite."

      # Sin huella, el runner aceptaria cualquier servidor que responda en VPS_HOST (y le entregaria el token de GHCR).
      - name: Exigir la huella SSH del VPS
        if: vars.VPS_HOST != '' && vars.VPS_SSH_FINGERPRINT == ''
        run: |
          echo "::error title=Deploy::Falta la variable VPS_SSH_FINGERPRINT (ver deploy/README.md, paso 5)."
          exit 1

      # Durante la CI y el build pudo entrar otro commit a main: un run viejo no debe pisar uno mas nuevo.
      # deploy-service.sh repite esta misma comprobacion en el VPS con el lock tomado (cierra la carrera
      # entre esta verificacion y el despliegue, y entre los CD de backend y web).
      - name: Comprobar que el commit sigue siendo la punta de main
        id: fresh
        if: vars.VPS_HOST != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -H 'Accept: application/vnd.github.sha')
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy::$GITHUB_SHA ya no es la punta de main ($current). Se omite este despliegue obsoleto."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.fresh.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Copiar archivos de despliegue al VPS
        if: steps.fresh.outputs.current == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ vars.VPS_HOST }}
          port: ${{ vars.VPS_PORT || 22 }}
          username: ${{ vars.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ vars.VPS_SSH_FINGERPRINT }}
          source: deploy/docker-compose.prod.yml,deploy/caddy,deploy/monitoring,deploy/scripts
          target: ${{ vars.VPS_APP_DIR || '/opt/omniretail' }}
          strip_components: 1

      - name: Actualizar backend en el VPS
        if: steps.fresh.outputs.current == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_TAG: ${{ needs.image.outputs.tag }}
          DEPLOY_REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          port: ${{ vars.VPS_PORT || 22 }}
          username: ${{ vars.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ vars.VPS_SSH_FINGERPRINT }}
          command_timeout: 15m
          # Token temporal del run (expira al terminar el job): el VPS no necesita guardar un PAT propio.
          # Tambien lo usa deploy-service.sh (solo lectura) para validar la vigencia del commit.
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_TAG,DEPLOY_REPO,DEPLOY_SHA
          script: |
            set -e
            cd "${{ vars.VPS_APP_DIR || '/opt/omniretail' }}"
            # Credenciales de GHCR aisladas por ejecucion: un CD concurrente (backend o web) nunca hace login
            # o logout sobre las credenciales de otro. compose viene como plugin del sistema, no de ~/.docker.
            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            compose() { docker compose -f docker-compose.prod.yml "$@"; }
            # Postgres primero: el usuario de monitoreo debe existir antes de levantar postgres-exporter.
            compose up -d --no-deps --wait postgres
            sh monitoring/postgres/ensure-monitoring-role.sh
            # Valida la vigencia con el lock tomado, fija la etiqueta, espera el healthcheck y hace rollback si falla.
            GITHUB_API_TOKEN="$GHCR_TOKEN" sh scripts/deploy-service.sh backend "$DEPLOY_TAG"
            compose up -d --no-deps caddy prometheus grafana node-exporter postgres-exporter
            # La config llega por carpetas montadas: se recarga sin cortar el trafico (Grafana relee el provisioning al reiniciar).
            compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            compose kill -s SIGHUP prometheus
            compose restart grafana
            docker image prune -f
