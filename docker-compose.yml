name: omniretail

services:
  postgres:
    image: postgres:16-alpine
    container_name: omniretail-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omniretail}
      POSTGRES_USER: ${POSTGRES_USER:-omniretail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniretail_dev}
    ports:
      # Desarrollo local: no publicar datos ni SMTP en la red local por defecto.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omniretail} -d ${POSTGRES_DB:-omniretail}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: omniretail-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Monitoreo opcional: docker compose --profile monitoring up -d
  # Scrapea al backend corriendo en el host (8080). Grafana en http://localhost:3001 (admin/admin);
  # las alertas de prueba llegan a Mailpit.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: omniretail-prometheus
    profiles: ["monitoring"]
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; en Docker Desktop ya existe.
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: omniretail-grafana
    profiles: ["monitoring"]
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: monitoreo@omniretail.local
      ALERT_EMAIL_TO: dev@omniretail.local
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
