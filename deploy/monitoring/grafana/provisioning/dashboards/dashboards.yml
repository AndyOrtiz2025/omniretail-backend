apiVersion: 1

# Dashboards versionados en git (JSON en ./json). Cambios hechos desde la UI no se guardan: se editan aqui.
providers:
  - name: omniretail
    folder: OmniRetail
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
