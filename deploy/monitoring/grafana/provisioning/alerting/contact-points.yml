apiVersion: 1

# Grafana expande ${VAR} desde su entorno (docker-compose.prod.yml). El SMTP sale de GF_SMTP_*.
contactPoints:
  - orgId: 1
    name: email-equipo
    receivers:
      - uid: email-equipo
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: true

policies:
  - orgId: 1
    receiver: email-equipo
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
