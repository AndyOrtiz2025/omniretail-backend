# Prometheus de produccion. Todos los targets se alcanzan por la red interna de Docker; ninguno se publica.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Actuator del backend en el puerto de management (application-prod.yaml -> management.server.port).
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]

  # CPU, RAM, disco y red del VPS.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Consumo por contenedor.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
