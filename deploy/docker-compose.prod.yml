# Stack de produccion de OmniRetail (backend + web + PostgreSQL + Caddy + monitoreo).
# Vive en el VPS en /opt/omniretail junto a un `.env` (ver env.prod.example). El CD del backend copia
# este archivo, ./caddy, ./monitoring y ./scripts en cada despliegue; los secretos del `.env` NUNCA salen del VPS.
# Las imagenes se despliegan con etiquetas inmutables (BACKEND_TAG / WEB_TAG en .env, las fija scripts/deploy-service.sh).
name: omniretail

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omniretail}
      POSTGRES_USER: ${POSTGRES_USER:-omniretail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin `ports`: la base de datos solo es accesible dentro de la red de Docker.

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/andyortiz2025/omniretail-backend}:${BACKEND_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MEDIA_STORAGE_PATH: /app/data/media
    volumes:
      - media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-ghcr.io/omniretail-project/omniretail-web}:${WEB_TAG:-latest}
    restart: unless-stopped
    environment:
      # El frontend habla con el backend por la red interna de Docker, no por internet.
      OMNIRETAIL_API_URL: http://backend:8080/api/v1
      # Origen publico (https) para el chequeo anti-CSRF: detras de Caddy, Next.js ve la peticion como http.
      APP_ORIGIN: ${FRONTEND_BASE_URL:?Define FRONTEND_BASE_URL en .env}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Dominio obligatorio: Caddy emite TLS y redirige HTTP a HTTPS automaticamente.
      SITE_ADDRESS: ${SITE_ADDRESS:?Define SITE_ADDRESS con un dominio HTTPS en .env}
    volumes:
      # Carpeta y no archivo suelto: un bind mount de archivo sigue viendo la version vieja cuando el CD la reemplaza.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - backend

  # --- Monitoreo (Prometheus + Grafana). Nada se publica a internet: Grafana solo escucha en 127.0.0.1
  # del VPS y se entra por tunel SSH (ver README). Config versionada en ./monitoring (la copia el CD).
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/config/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus/config:ro # Carpeta: ver nota de Caddy.
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:3001:3000" # Solo loopback: ssh -L 3001:127.0.0.1:3001 deploy@<VPS>
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env}
      GF_SERVER_ROOT_URL: http://localhost:3001 # Los enlaces de los correos de alerta apuntan al tunel SSH.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Las alertas salen por el mismo SMTP que usa el backend.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${MAIL_HOST}:${MAIL_PORT}
      GF_SMTP_USER: ${MAIL_USERNAME}
      GF_SMTP_PASSWORD: ${MAIL_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${MAIL_USERNAME}
      GF_SMTP_FROM_NAME: OmniRetail Monitoreo
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?Define ALERT_EMAIL_TO en .env}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    mem_limit: 64m
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-omniretail}?sslmode=disable
      # Usuario dedicado con rol pg_monitor (sin acceso a datos); lo crea monitoring/postgres/ensure-monitoring-role.sh.
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:-omniretail_monitor}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?Define POSTGRES_EXPORTER_PASSWORD en .env}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
