# Perfil de tests. La base de datos la provee Testcontainers (@ServiceConnection).
spring:
  liquibase:
    contexts: test

app:
  security:
    public-rate-limit:
      # La suite comparte una IP simulada; los límites se validan de forma unitaria.
      enabled: false
    login-failure-limit:
      # Igual: los tests de bloqueo (B-01) fallan mas de 5 veces con el mismo correo e IP.
      enabled: false
      max-failures: 5
      window-seconds: 900
      max-tracked-keys: 10000
  jwt:
    secret: omniretail-test-secret-only-for-tests-32b
  mfa:
    encryption-key: omniretail-test-mfa-key-only-for-tests-32b
  mail:
    credential:
      encryption-key: omniretail-test-email-key-only-for-tests-32b
    delivery:
      retry-enabled: false # los tests invocan el reintento a mano
