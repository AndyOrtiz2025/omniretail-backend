# Changelog maestro. NO agregar changesets aqui.
#
# Cada modulo agrega su propio archivo en `changes/`, que se ejecuta en orden alfabetico:
#   001-tenants-branches.yaml, ..., 032-product-sales-price-tiers.yaml,
#   033-product-media.yaml, 034-product-kits.yaml, 035-catalog-promotions-editor-support.yaml,
#   036-inventory-reservation-sources.yaml, ..., 041-logistics-dispatch.yaml, ...
#   999-01-seed-base.yaml, 999-02-..., 999-03-... (semillas demo: marcar sus changesets con
#   `context: dev`; el sufijo numerico despues de `999-` evita que el orden alfabetico dependa
#   de si el nombre siguiente tiene mas guiones que el actual).
#
# Reglas:
# - Un changeset ya aplicado (y subido a `development`) nunca se edita: se corrige con uno nuevo.
# - id del changeset: <numero>-<descripcion>, author: usuario de GitHub.
databaseChangeLog:
  - includeAll:
      path: db/changelog/changes/
      endsWithFilter: .yaml
      errorIfMissingOrEmpty: false
