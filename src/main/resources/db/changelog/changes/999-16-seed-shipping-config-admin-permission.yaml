databaseChangeLog:
  - changeSet:
      id: 999-16-seed-shipping-config-admin-permission
      author: joga17000
      context: dev
      changes:
        - sql:
            # En una BD nueva 066 corre antes de 999-01 y no encuentra el Administrador; este seed le concede
            # la configuracion de envios al Administrador de sistema. Mismo patron que 999-15.
            sql: |
              UPDATE roles
              SET permissions = (
                SELECT ARRAY(
                  SELECT DISTINCT permission
                  FROM unnest(COALESCE(permissions, ARRAY[]::text[])
                              || ARRAY['admin.shipping_config.manage']::text[]) AS permission
                  ORDER BY permission
                )
              )
              WHERE name = 'Administrador' AND is_system = TRUE;
      rollback:
        # Seed de demo: sin efecto intencional (no se sabe si el permiso ya existia antes).
        - sql:
            sql: SELECT 1
