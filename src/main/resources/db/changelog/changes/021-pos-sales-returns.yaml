databaseChangeLog:
  - changeSet:
      id: 021-pos-sales-returns
      author: mafer
      changes:
        - createTable:
            tableName: sale_returns
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: branch_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: sale_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: refund_amount
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_by_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            tableName: sale_return_items
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: return_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: sale_item_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: NUMERIC(12,3)
                  constraints:
                    nullable: false
              - column:
                  name: refund_amount
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: sale_returns
            indexName: idx_sale_returns_tenant_branch
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: branch_id
        - createIndex:
            tableName: sale_return_items
            indexName: idx_sale_return_items_return
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: return_id
