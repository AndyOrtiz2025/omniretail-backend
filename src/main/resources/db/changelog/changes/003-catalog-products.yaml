databaseChangeLog:
  - changeSet:
      id: 003-catalog-products
      author: joga17000
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    referencedTableName: tenants
                    referencedColumnNames: id
                    foreignKeyName: fk_categories_tenant
              - column:
                  name: parent_id
                  type: UUID
                  constraints:
                    nullable: true
                    referencedTableName: categories
                    referencedColumnNames: id
                    foreignKeyName: fk_categories_parent
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: image_url
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: active
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: categories
            columnNames: tenant_id, slug
            constraintName: uk_categories_tenant_slug
        - sql:
            sql: "ALTER TABLE categories ADD CONSTRAINT ck_categories_status CHECK (status IN ('active', 'archived'))"
        - createTable:
            tableName: units
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    referencedTableName: tenants
                    referencedColumnNames: id
                    foreignKeyName: fk_units_tenant
              - column:
                  name: code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: symbol
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: allows_decimals
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: active
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: units
            columnNames: tenant_id, code
            constraintName: uk_units_tenant_code
        - sql:
            sql: "ALTER TABLE units ADD CONSTRAINT ck_units_category CHECK (category IN ('unit', 'weight', 'length', 'volume', 'other'))"
        - sql:
            sql: "ALTER TABLE units ADD CONSTRAINT ck_units_status CHECK (status IN ('active', 'archived'))"
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    referencedTableName: tenants
                    referencedColumnNames: id
                    foreignKeyName: fk_products_tenant
              - column:
                  name: sku
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: barcode
                  type: VARCHAR(50)
              - column:
                  name: name
                  type: VARCHAR(300)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: brand
                  type: VARCHAR(100)
              - column:
                  name: product_type
                  type: VARCHAR(20)
                  defaultValue: physical
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false
                    referencedTableName: categories
                    referencedColumnNames: id
                    foreignKeyName: fk_products_category
              - column:
                  name: base_unit_id
                  type: UUID
                  constraints:
                    nullable: false
                    referencedTableName: units
                    referencedColumnNames: id
                    foreignKeyName: fk_products_base_unit
              - column:
                  name: inventory_unit_id
                  type: UUID
                  constraints:
                    nullable: true
                    referencedTableName: units
                    referencedColumnNames: id
                    foreignKeyName: fk_products_inventory_unit
              - column:
                  name: sale_unit_id
                  type: UUID
                  constraints:
                    nullable: true
                    referencedTableName: units
                    referencedColumnNames: id
                    foreignKeyName: fk_products_sale_unit
              - column:
                  name: sale_price
                  type: NUMERIC(12,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: published
                  constraints:
                    nullable: false
              - column:
                  name: tracking_stock
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: tracking_lot
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: tracking_expiration
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: tracking_serial
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: channel_ecommerce
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: channel_pos
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: channel_mobile_app
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: products
            columnNames: tenant_id, sku
            constraintName: uk_products_tenant_sku
        - createIndex:
            tableName: products
            indexName: idx_products_tenant_category
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: category_id
        - sql:
            sql: "ALTER TABLE products ADD CONSTRAINT ck_products_type CHECK (product_type IN ('physical', 'service', 'kit'))"
        - sql:
            sql: "ALTER TABLE products ADD CONSTRAINT ck_products_status CHECK (status IN ('published', 'archived'))"
        - createTable:
            tableName: unit_conversions
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    referencedTableName: tenants
                    referencedColumnNames: id
                    foreignKeyName: fk_unit_conversions_tenant
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: true
                    referencedTableName: products
                    referencedColumnNames: id
                    foreignKeyName: fk_unit_conversions_product
                    deleteCascade: true
              - column:
                  name: from_unit_id
                  type: UUID
                  constraints:
                    nullable: false
                    referencedTableName: units
                    referencedColumnNames: id
                    foreignKeyName: fk_unit_conversions_from_unit
              - column:
                  name: to_unit_id
                  type: UUID
                  constraints:
                    nullable: false
                    referencedTableName: units
                    referencedColumnNames: id
                    foreignKeyName: fk_unit_conversions_to_unit
              - column:
                  name: factor
                  type: NUMERIC(18,6)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: unit_conversions
            indexName: idx_unit_conversions_product
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: product_id
        - sql:
            sql: "ALTER TABLE unit_conversions ADD CONSTRAINT ck_unit_conversions_factor CHECK (factor > 0)"
