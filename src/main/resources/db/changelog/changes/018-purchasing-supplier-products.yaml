databaseChangeLog:
  - changeSet:
      id: 018-purchasing-supplier-products
      author: joga17000
      changes:
        - createTable:
            tableName: supplier_products
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: supplier_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: supplier_sku
                  type: VARCHAR(100)
              - column:
                  name: purchase_unit_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: purchase_to_base_factor
                  type: NUMERIC(18,6)
                  constraints:
                    nullable: false
              - column:
                  name: last_cost
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: lead_time_days
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: minimum_order_quantity
                  type: NUMERIC(12,3)
                  constraints:
                    nullable: false
              - column:
                  name: preferred
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: supplier_products
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
            constraintName: fk_supplier_products_tenant
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: supplier_products
            baseColumnNames: supplier_id
            referencedTableName: suppliers
            referencedColumnNames: id
            constraintName: fk_supplier_products_supplier
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: supplier_products
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_supplier_products_product
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: supplier_products
            baseColumnNames: purchase_unit_id
            referencedTableName: units
            referencedColumnNames: id
            constraintName: fk_supplier_products_purchase_unit
            onDelete: RESTRICT
        - addUniqueConstraint:
            tableName: supplier_products
            columnNames: tenant_id, supplier_id, product_id
            constraintName: uk_supplier_products_tenant_supplier_product
        - sql:
            sql: "ALTER TABLE supplier_products ADD CONSTRAINT ck_supplier_products_factor CHECK (purchase_to_base_factor > 0)"
        - sql:
            sql: "ALTER TABLE supplier_products ADD CONSTRAINT ck_supplier_products_last_cost CHECK (last_cost >= 0)"
        - sql:
            sql: "ALTER TABLE supplier_products ADD CONSTRAINT ck_supplier_products_lead_time CHECK (lead_time_days >= 0)"
        - sql:
            sql: "ALTER TABLE supplier_products ADD CONSTRAINT ck_supplier_products_moq CHECK (minimum_order_quantity > 0)"
        - sql:
            sql: "CREATE UNIQUE INDEX uk_supplier_products_active_preferred ON supplier_products (tenant_id, product_id) WHERE preferred = true AND active = true"
        - createIndex:
            tableName: supplier_products
            indexName: idx_supplier_products_tenant_product
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: product_id
        - createIndex:
            tableName: supplier_products
            indexName: idx_supplier_products_tenant_active
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: active
        - createTable:
            tableName: supplier_cost_tiers
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: supplier_product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: min_quantity
                  type: NUMERIC(12,3)
                  constraints:
                    nullable: false
              - column:
                  name: unit_cost
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: supplier_cost_tiers
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
            constraintName: fk_supplier_cost_tiers_tenant
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: supplier_cost_tiers
            baseColumnNames: supplier_product_id
            referencedTableName: supplier_products
            referencedColumnNames: id
            constraintName: fk_supplier_cost_tiers_supplier_product
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: supplier_cost_tiers
            columnNames: supplier_product_id, min_quantity
            constraintName: uk_supplier_cost_tiers_product_quantity
        - sql:
            sql: "ALTER TABLE supplier_cost_tiers ADD CONSTRAINT ck_supplier_cost_tiers_min_quantity CHECK (min_quantity > 0)"
        - sql:
            sql: "ALTER TABLE supplier_cost_tiers ADD CONSTRAINT ck_supplier_cost_tiers_unit_cost CHECK (unit_cost >= 0)"
        - createIndex:
            tableName: supplier_cost_tiers
            indexName: idx_supplier_cost_tiers_supplier_product
            columns:
              - column:
                  name: supplier_product_id
