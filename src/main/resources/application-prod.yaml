# Produccion. Todo valor sensible viene de variables de entorno, sin defaults.
spring:
  liquibase:
    contexts: prod # La semilla demo (context: dev) nunca se carga aqui.

app:
  jwt:
    secret: ${JWT_SECRET} # Obligatoria: la app no arranca sin ella.
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY} # Obligatoria: la app no arranca sin ella.
  mail:
    credential:
      encryption-key: ${EMAIL_CREDENTIAL_ENCRYPTION_KEY} # Obligatoria: la app no arranca sin ella.

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Actuator en un puerto aparte: Caddy no lo enruta y no se publica, solo Prometheus lo alcanza por la red de Docker.
management:
  server:
    port: 8081

logging:
  level:
    com.omniretail: INFO
