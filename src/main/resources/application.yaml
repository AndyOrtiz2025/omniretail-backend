# Configuracion base, comun a todos los perfiles.
# Los valores sensibles o propios de cada maquina salen de variables de entorno / `.env`.
spring:
  application:
    name: omniretail-backend

  data:
    web:
      pageable:
        one-indexed-parameters: true

  # Lee el `.env` de la raiz del proyecto si existe (mismo archivo que usa docker compose).
  config:
    import: optional:file:.env[.properties]

  # Sin perfil explicito se asume desarrollo local. Produccion activa `prod` a proposito.
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:omniretail}
    username: ${POSTGRES_USER:omniretail}
    password: ${POSTGRES_PASSWORD:omniretail_dev}

  jpa:
    hibernate:
      ddl-auto: validate # Liquibase administra el esquema; Hibernate solo valida.
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:6MB}

  # SMTP. En desarrollo apunta a Mailpit (docker compose); usuario y clave son opcionales.
  # Para Gmail (smtp.gmail.com:587) hay que activar MAIL_SMTP_AUTH y MAIL_SMTP_STARTTLS; por defecto
  # quedan apagados para que Mailpit, que no habla TLS, siga funcionando igual.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${MAIL_SMTP_TIMEOUT_MILLIS:10000}
      mail.smtp.timeout: ${MAIL_SMTP_TIMEOUT_MILLIS:10000}
      mail.smtp.writetimeout: ${MAIL_SMTP_TIMEOUT_MILLIS:10000}

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  api:
    base-path: /api/v1
  auth:
    # Minutos sin actividad tras los que el servidor cierra la sesion de un empleado (clientes no aplica).
    employee-idle-timeout: ${EMPLOYEE_IDLE_TIMEOUT_MINUTES:60}m
  jwt:
    secret: ${JWT_SECRET:}
    issuer: omniretail-backend
  mfa:
    # Clave maestra de la verificacion en dos pasos (secreto TOTP cifrado y HMAC de los codigos de
    # recuperacion). Minimo 32 bytes. Mismo patron que app.jwt.secret: valor de dev en application-dev.
    encryption-key: ${MFA_ENCRYPTION_KEY:}
  google:
    # Client ID web de Google Cloud para "Iniciar sesion con Google". Opcional: vacio, la app arranca
    # igual y POST /auth/google responde 503 GOOGLE_LOGIN_NOT_CONFIGURED.
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    public-rate-limit:
      # Limites por IP y grupo de endpoint anonimo. Se aplica antes de llegar a los controllers.
      enabled: ${PUBLIC_RATE_LIMIT_ENABLED:true}
      window-seconds: ${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}
      max-tracked-clients: ${PUBLIC_RATE_LIMIT_MAX_TRACKED_CLIENTS:10000}
      # Comparte grupo con POST /auth/google. Holgado para NAT compartido; el tope por correo va abajo.
      login-per-window: ${PUBLIC_RATE_LIMIT_LOGIN_PER_WINDOW:15}
      mfa-per-window: ${PUBLIC_RATE_LIMIT_MFA_PER_WINDOW:10}
      recovery-per-window: ${PUBLIC_RATE_LIMIT_RECOVERY_PER_WINDOW:5}
      registration-per-window: ${PUBLIC_RATE_LIMIT_REGISTRATION_PER_WINDOW:5}
      checkout-per-window: ${PUBLIC_RATE_LIMIT_CHECKOUT_PER_WINDOW:20}
      tracking-per-window: ${PUBLIC_RATE_LIMIT_TRACKING_PER_WINDOW:30}
      contact-per-window: ${PUBLIC_RATE_LIMIT_CONTACT_PER_WINDOW:3}
    login-failure-limit:
      # Logins fallidos por IP + email normalizado (en memoria). Convive con el bloqueo por cuenta (B-01).
      enabled: ${LOGIN_FAILURE_LIMIT_ENABLED:true}
      max-failures: ${LOGIN_FAILURE_LIMIT_MAX_FAILURES:5}
      window-seconds: ${LOGIN_FAILURE_LIMIT_WINDOW_SECONDS:900}
      max-tracked-keys: ${LOGIN_FAILURE_LIMIT_MAX_TRACKED_KEYS:10000}
  commercial:
    # Solicitudes comerciales de la landing MARJYM. SOLO el servicio comercial lo activa; las instalaciones de
    # clientes lo dejan en false: sin controller, sin jobs y sin correos comerciales.
    contact-requests:
      enabled: ${COMMERCIAL_CONTACT_REQUESTS_ENABLED:false}
      # Buzon del equipo que recibe el aviso interno (obligatorio al habilitar).
      team-notification-to: ${COMMERCIAL_CONTACT_TEAM_TO:}
      # Secreto del servidor para el hash de IP y correo (minimo 32 caracteres; obligatorio al habilitar).
      ip-hash-secret: ${COMMERCIAL_CONTACT_HASH_SECRET:}
      max-body-bytes: ${COMMERCIAL_CONTACT_MAX_BODY_BYTES:16384}
      per-ip-per-day: ${COMMERCIAL_CONTACT_PER_IP_PER_DAY:10}
      per-email-per-day: ${COMMERCIAL_CONTACT_PER_EMAIL_PER_DAY:3}
      global-per-day: ${COMMERCIAL_CONTACT_GLOBAL_PER_DAY:200}
      retention-days: ${COMMERCIAL_CONTACT_RETENTION_DAYS:365}
      spam-retention-days: ${COMMERCIAL_CONTACT_SPAM_RETENTION_DAYS:30}
      mail-max-attempts: ${COMMERCIAL_CONTACT_MAIL_MAX_ATTEMPTS:5}
      mail-initial-delay: ${COMMERCIAL_CONTACT_MAIL_INITIAL_DELAY:PT2M}
      mail-base-backoff: ${COMMERCIAL_CONTACT_MAIL_BASE_BACKOFF:PT5M}
      mail-retry-interval: ${COMMERCIAL_CONTACT_MAIL_RETRY_INTERVAL:PT1M}
      purge-cron: ${COMMERCIAL_CONTACT_PURGE_CRON:0 30 3 * * *}
      captcha:
        enabled: ${COMMERCIAL_CAPTCHA_ENABLED:false}
        secret: ${COMMERCIAL_CAPTCHA_SECRET:}
        verify-url: ${COMMERCIAL_CAPTCHA_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
        timeout: ${COMMERCIAL_CAPTCHA_TIMEOUT:PT5S}
  provisioning:
    # Aprovisionamiento interno de complementos de UN tenant. Apagado por defecto. Cada operation-id se aplica una
    # sola vez (bitacora subscription_provisioning_operations): reiniciar con el mismo id no reescribe nada; para
    # cambiar los complementos hay que usar un operation-id nuevo.
    subscription:
      enabled: ${PROVISIONING_SUBSCRIPTION_ENABLED:false}
      operation-id: ${PROVISIONING_SUBSCRIPTION_OPERATION_ID:}
      tenant-id: ${PROVISIONING_SUBSCRIPTION_TENANT_ID:}
      addon-codes: ${PROVISIONING_SUBSCRIPTION_ADDONS:}
  mail:
    from: ${MAIL_FROM:no-reply@omniretail.local}
    credential:
      # Clave maestra que cifra la contrasena de aplicacion de Gmail de cada tenant y los cuerpos de correo
      # pendientes de reintento. Minimo 32 bytes. Valor de dev en application-dev; obligatoria en prod.
      encryption-key: ${EMAIL_CREDENTIAL_ENCRYPTION_KEY:}
    gmail:
      host: ${GMAIL_SMTP_HOST:smtp.gmail.com}
      port: ${GMAIL_SMTP_PORT:587}
      timeout-millis: ${GMAIL_SMTP_TIMEOUT_MILLIS:10000}
    delivery:
      # Reintento de correos operativos que fallaron por transporte (backoff exponencial, con tope).
      retry-enabled: ${EMAIL_RETRY_ENABLED:true}
      retry-interval: ${EMAIL_RETRY_INTERVAL:PT1M}
      initial-delay: ${EMAIL_RETRY_INITIAL_DELAY:PT2M}
      base-backoff: ${EMAIL_RETRY_BASE_BACKOFF:PT1M}
      max-attempts: ${EMAIL_RETRY_MAX_ATTEMPTS:5}
      batch-size: ${EMAIL_RETRY_BATCH_SIZE:20}
  frontend:
    # Base de los enlaces que viajan en los correos (verificacion y recuperacion).
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    max-size-bytes: ${MEDIA_MAX_SIZE_BYTES:5242880}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: omniretail-backend # Etiqueta comun para filtrar en Grafana.
    distribution:
      percentiles-histogram:
        http.server.requests: true # Histogramas para calcular p95/p99 de latencia en Prometheus.
