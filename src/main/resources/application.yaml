# Configuracion base, comun a todos los perfiles.
# Los valores sensibles o propios de cada maquina salen de variables de entorno / `.env`.
spring:
  application:
    name: omniretail-backend

  data:
    web:
      pageable:
        one-indexed-parameters: true

  # Lee el `.env` de la raiz del proyecto si existe (mismo archivo que usa docker compose).
  config:
    import: optional:file:.env[.properties]

  # Sin perfil explicito se asume desarrollo local. Produccion activa `prod` a proposito.
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:omniretail}
    username: ${POSTGRES_USER:omniretail}
    password: ${POSTGRES_PASSWORD:omniretail_dev}

  jpa:
    hibernate:
      ddl-auto: validate # Liquibase administra el esquema; Hibernate solo valida.
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:6MB}

  # SMTP. En desarrollo apunta a Mailpit (docker compose); usuario y clave son opcionales.
  # Para Gmail (smtp.gmail.com:587) hay que activar MAIL_SMTP_AUTH y MAIL_SMTP_STARTTLS; por defecto
  # quedan apagados para que Mailpit, que no habla TLS, siga funcionando igual.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${MAIL_SMTP_TIMEOUT_MILLIS:10000}
      mail.smtp.timeout: ${MAIL_SMTP_TIMEOUT_MILLIS:10000}
      mail.smtp.writetimeout: ${MAIL_SMTP_TIMEOUT_MILLIS:10000}

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  api:
    base-path: /api/v1
  jwt:
    secret: ${JWT_SECRET:}
    issuer: omniretail-backend
  mfa:
    # Clave maestra de la verificacion en dos pasos (secreto TOTP cifrado y HMAC de los codigos de
    # recuperacion). Minimo 32 bytes. Mismo patron que app.jwt.secret: valor de dev en application-dev.
    encryption-key: ${MFA_ENCRYPTION_KEY:}
  google:
    # Client ID web de Google Cloud para "Iniciar sesion con Google". Opcional: vacio, la app arranca
    # igual y POST /auth/google responde 503 GOOGLE_LOGIN_NOT_CONFIGURED.
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  mail:
    from: ${MAIL_FROM:no-reply@omniretail.local}
    credential:
      # Clave maestra que cifra la contrasena de aplicacion de Gmail de cada tenant y los cuerpos de correo
      # pendientes de reintento. Minimo 32 bytes. Valor de dev en application-dev; obligatoria en prod.
      encryption-key: ${EMAIL_CREDENTIAL_ENCRYPTION_KEY:}
    gmail:
      host: ${GMAIL_SMTP_HOST:smtp.gmail.com}
      port: ${GMAIL_SMTP_PORT:587}
      timeout-millis: ${GMAIL_SMTP_TIMEOUT_MILLIS:10000}
    delivery:
      # Reintento de correos operativos que fallaron por transporte (backoff exponencial, con tope).
      retry-enabled: ${EMAIL_RETRY_ENABLED:true}
      retry-interval: ${EMAIL_RETRY_INTERVAL:PT1M}
      initial-delay: ${EMAIL_RETRY_INITIAL_DELAY:PT2M}
      base-backoff: ${EMAIL_RETRY_BASE_BACKOFF:PT1M}
      max-attempts: ${EMAIL_RETRY_MAX_ATTEMPTS:5}
      batch-size: ${EMAIL_RETRY_BATCH_SIZE:20}
  frontend:
    # Base de los enlaces que viajan en los correos (verificacion y recuperacion).
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    max-size-bytes: ${MEDIA_MAX_SIZE_BYTES:5242880}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
